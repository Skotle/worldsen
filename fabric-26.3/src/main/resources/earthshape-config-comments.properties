# UTF-8 descriptions for generated config / 생성 설정 파일의 영문·한글 설명

map_scale.blocksPerPixel.en=World blocks per source-map pixel; 10 gives a 60000 x 34000 block map.
map_scale.blocksPerPixel.ko=원본 지도 픽셀당 월드 블록 수입니다. 10이면 지도 크기는 60000 x 34000블록입니다.
map_scale.blocksPerPixel.range=1 .. 4096

map_scale.randomCenterEnabled.en=Choose the map center from the configured pixel bounds using the world seed. Does not change world spawn.
map_scale.randomCenterEnabled.ko=월드 시드로 아래 픽셀 범위에서 지도 중심을 선택합니다. 월드 스폰 좌표는 바꾸지 않습니다.
map_scale.randomCenterEnabled.range=true, false

map_scale.randomCenterMinLayerX.en=Minimum source X pixel for random map-center selection.
map_scale.randomCenterMinLayerX.ko=무작위 지도 중심을 선택할 원본 X 픽셀 좌표의 최솟값입니다.
map_scale.randomCenterMinLayerX.range=0 .. 5999

map_scale.randomCenterMaxLayerX.en=Maximum source X pixel for random map-center selection.
map_scale.randomCenterMaxLayerX.ko=무작위 지도 중심을 선택할 원본 X 픽셀 좌표의 최댓값입니다.
map_scale.randomCenterMaxLayerX.range=0 .. 5999

map_scale.randomCenterMinLayerZ.en=Minimum source Z (image row) pixel for random map-center selection.
map_scale.randomCenterMinLayerZ.ko=무작위 지도 중심을 선택할 원본 Z 픽셀 좌표(이미지 행)의 최솟값입니다.
map_scale.randomCenterMinLayerZ.range=0 .. 3399

map_scale.randomCenterMaxLayerZ.en=Maximum source Z (image row) pixel for random map-center selection.
map_scale.randomCenterMaxLayerZ.ko=무작위 지도 중심을 선택할 원본 Z 픽셀 좌표(이미지 행)의 최댓값입니다.
map_scale.randomCenterMaxLayerZ.range=0 .. 3399

layers.continentsEnabled.en=Enable source-map land/ocean shaping.
layers.continentsEnabled.ko=원본 지도의 육지와 바다 형태를 지형 생성에 적용합니다.
layers.continentsEnabled.range=true, false

layers.continentHeightLimitEnabled.en=Legacy height-limit option retained for config compatibility; currently not read by the terrain calculation.
layers.continentHeightLimitEnabled.ko=설정 호환성을 위해 유지되는 기존 고도 제한 옵션입니다. 현재 지형 계산에서는 사용하지 않습니다.
layers.continentHeightLimitEnabled.range=true, false

layers.terrainBiomesEnabled.en=Use terrain.bmp to guide terrain families and biome selection.
layers.terrainBiomesEnabled.ko=terrain.bmp를 사용하여 지형 종류와 바이옴 선택을 유도합니다.
layers.terrainBiomesEnabled.range=true, false

layers.terrainBiomeMinimumRegionPixels.en=Minimum connected terrain region in source pixels; smaller fragments merge into neighbors. Internal cleanup and chunk-area limits also apply.
layers.terrainBiomeMinimumRegionPixels.ko=연결된 지형 영역의 최소 원본 픽셀 수입니다. 작은 조각은 주변으로 병합되며 내부 정리 기준과 청크 면적 제한도 적용됩니다.
layers.terrainBiomeMinimumRegionPixels.range=1 .. 4096

layers.terrainBiomeIsolatedMinimumRegionPixels.en=Minimum isolated terrain region in source pixels when surrounded by one terrain family; additional cleanup limits apply.
layers.terrainBiomeIsolatedMinimumRegionPixels.ko=하나의 지형 종류로 둘러싸인 고립 영역의 최소 원본 픽셀 수입니다. 추가적인 내부 정리 기준도 적용됩니다.
layers.terrainBiomeIsolatedMinimumRegionPixels.range=1 .. 4096

layers.biomeMinimumRegionPixels.en=Minimum connected temperature/vegetation region in source pixels; small fragments merge into adjacent regions.
layers.biomeMinimumRegionPixels.ko=온도 및 수목 레이어에서 유지할 연결 영역의 최소 원본 픽셀 수입니다. 작은 조각은 인접 영역으로 병합됩니다.
layers.biomeMinimumRegionPixels.range=1 .. 4096

layers.biomeMinimumRegionChunks.en=Minimum land-layer region area in generated chunks; combines with pixel limits using the map scale.
layers.biomeMinimumRegionChunks.ko=생성 청크 기준 육지 레이어 영역의 최소 면적입니다. 지도 축척에 따라 픽셀 기준과 함께 적용됩니다.
layers.biomeMinimumRegionChunks.range=1 .. 4096

layers.biomeIsolatedMinimumRegionChunks.en=Minimum generated-chunk area for an isolated land-layer region.
layers.biomeIsolatedMinimumRegionChunks.ko=고립된 육지 레이어 영역에 적용할 생성 청크 기준 최소 면적입니다.
layers.biomeIsolatedMinimumRegionChunks.range=1 .. 4096

layers.rareBiomeMinimumRegionChunks.en=Required supporting terrain area for rare land biome variants; 0 disables this check. Hills, mountains and water are excluded.
layers.rareBiomeMinimumRegionChunks.ko=희귀 육지 바이옴 변종에 필요한 주변 지형 면적입니다. 0이면 검사를 끕니다. 언덕, 산악, 수역에는 적용하지 않습니다.
layers.rareBiomeMinimumRegionChunks.range=0 .. 4096

layers.oceanTemperatureEnabled.en=Use earth_temperature.png to guide ocean temperature biomes.
layers.oceanTemperatureEnabled.ko=earth_temperature.png의 온도로 해양 바이옴을 선택합니다.
layers.oceanTemperatureEnabled.range=true, false

layers.tundraTemperatureEnabled.en=Use the temperature map to guide cold land biomes such as tundra and taiga.
layers.tundraTemperatureEnabled.ko=온도 지도로 툰드라와 타이가 같은 추운 육지 바이옴을 선택합니다.
layers.tundraTemperatureEnabled.range=true, false

layers.tundraTemperatureThreshold.en=Temperature threshold for cold land classification; larger values allow a wider cold-biome range.
layers.tundraTemperatureThreshold.ko=추운 육지로 분류하는 온도 기준입니다. 높일수록 추운 바이옴의 범위가 넓어집니다.
layers.tundraTemperatureThreshold.range=-1.0 .. 1.0

layers.snowAltitudeBlocks.en=Altitude Y at which highland biomes may receive snow independently of the temperature map.
layers.snowAltitudeBlocks.ko=온도 지도와 관계없이 고지대 바이옴에 눈을 허용하는 Y 고도입니다.
layers.snowAltitudeBlocks.range=160 .. 320

layers.snowTemperatureThreshold.en=Temperature-map threshold for snow below the altitude snow line; also used to restrict warm-ocean icebergs.
layers.snowTemperatureThreshold.ko=고도 설선 아래에서 눈을 허용하는 온도 기준입니다. 따뜻한 바다의 빙산 제한에도 사용됩니다.
layers.snowTemperatureThreshold.range=-1.0 .. 0.0

layers.riverBiomesEnabled.en=Use mapped river lines to guide river biomes and channel shaping.
layers.riverBiomesEnabled.ko=지도에 그려진 강 선을 강 바이옴과 수로 형상에 적용합니다.
layers.riverBiomesEnabled.range=true, false

layers.biomeBoundaryWarpEnabled.en=Bend long raster biome boundaries smoothly while keeping mapped coasts and rivers in place.
layers.biomeBoundaryWarpEnabled.ko=긴 격자형 바이옴 경계를 부드럽게 휘게 합니다. 지도상의 해안과 강 위치는 유지합니다.
layers.biomeBoundaryWarpEnabled.range=true, false

layers.biomeBoundaryWarpBlocks.en=Maximum biome-layer sampling displacement in blocks; 0 disables displacement.
layers.biomeBoundaryWarpBlocks.ko=바이옴 레이어 샘플링 좌표의 최대 이동 거리(블록)입니다. 0이면 이동하지 않습니다.
layers.biomeBoundaryWarpBlocks.range=0 .. 64

terrain_shaping.coastHeightFadeBlocks.en=Land/ocean mask smoothing distance around the coastline, in blocks.
terrain_shaping.coastHeightFadeBlocks.ko=해안선 주변 육지 및 바다 마스크를 부드럽게 연결하는 거리(블록)입니다.
terrain_shaping.coastHeightFadeBlocks.range=20 .. 1024

terrain_shaping.coastShelfVariationEnabled.en=Vary shelf depth/range coherently by coastal region and seed; disabled uses the midpoint of the range bounds.
terrain_shaping.coastShelfVariationEnabled.ko=해안 구간과 시드에 따라 대륙붕 깊이와 범위를 변화시킵니다. 끄면 범위 상하한의 중간값을 사용합니다.
terrain_shaping.coastShelfVariationEnabled.range=true, false

terrain_shaping.coastShallowShelfWidthBlocks.en=Width of the shallow shelf immediately offshore, in blocks; starting depth varies by coastal reach.
terrain_shaping.coastShallowShelfWidthBlocks.ko=해안 직후 얕은 대륙붕의 폭(블록)입니다. 시작 수심은 해안 구간에 따라 달라집니다.
terrain_shaping.coastShallowShelfWidthBlocks.range=4 .. 8

terrain_shaping.coastShelfTransitionBlocks.en=Nearshore transition length after the shallow shelf, before the offshore run-out.
terrain_shaping.coastShelfTransitionBlocks.ko=얕은 대륙붕 이후 바깥 해저로 이어지기 전의 근해 전이 거리(블록)입니다.
terrain_shaping.coastShelfTransitionBlocks.range=4 .. 128

terrain_shaping.coastShelfMinimumRangeBlocks.en=Minimum offshore shelf run-out, in blocks; swapped with the maximum if entered in reverse order.
terrain_shaping.coastShelfMinimumRangeBlocks.ko=바깥 대륙붕 전이 거리의 최솟값(블록)입니다. 최대값보다 크면 내부에서 두 값을 교환합니다.
terrain_shaping.coastShelfMinimumRangeBlocks.range=2 .. 200

terrain_shaping.coastShelfMaximumRangeBlocks.en=Maximum offshore shelf run-out toward deeper seabed, in blocks.
terrain_shaping.coastShelfMaximumRangeBlocks.ko=깊은 해저로 이어지는 바깥 대륙붕 전이 거리의 최댓값(블록)입니다.
terrain_shaping.coastShelfMaximumRangeBlocks.range=2 .. 200

terrain_shaping.coastShelfDeepFloorY.en=Target base Y of the deeper seabed at the end of the shelf transition.
terrain_shaping.coastShelfDeepFloorY.ko=대륙붕 전이가 향하는 깊은 해저 바닥의 기준 Y 좌표입니다.
terrain_shaping.coastShelfDeepFloorY.range=-64 .. 61

terrain_shaping.islandMaximumSurfaceY.en=Legacy small-island height limit retained for config compatibility; currently unused.
terrain_shaping.islandMaximumSurfaceY.ko=설정 호환성을 위해 유지되는 기존 작은 섬의 최대 고도입니다. 현재 사용하지 않습니다.
terrain_shaping.islandMaximumSurfaceY.range=64 .. 319

terrain_shaping.regionalMaximumSurfaceY.en=Legacy regional-landmass height limit retained for config compatibility; currently unused.
terrain_shaping.regionalMaximumSurfaceY.ko=설정 호환성을 위해 유지되는 기존 중형 육지의 최대 고도입니다. 현재 사용하지 않습니다.
terrain_shaping.regionalMaximumSurfaceY.range=64 .. 319

terrain_shaping.continentMaximumSurfaceY.en=Legacy continent height limit retained for config compatibility; currently unused.
terrain_shaping.continentMaximumSurfaceY.ko=설정 호환성을 위해 유지되는 기존 대륙의 최대 고도입니다. 현재 사용하지 않습니다.
terrain_shaping.continentMaximumSurfaceY.range=64 .. 319

terrain_shaping.mountainRegionMinimumSurfaceY.en=Legacy small-mountain height limit retained for config compatibility; currently unused.
terrain_shaping.mountainRegionMinimumSurfaceY.ko=설정 호환성을 위해 유지되는 기존 작은 산악 영역의 고도 제한입니다. 현재 사용하지 않습니다.
terrain_shaping.mountainRegionMinimumSurfaceY.range=64 .. 319

terrain_shaping.mountainRegionFullHeightSpanBlocks.en=Representative world width at which a connected mountain region receives full relief guidance.
terrain_shaping.mountainRegionFullHeightSpanBlocks.ko=연결된 산악 영역에 최대 기복 유도를 적용하기 시작하는 대표 월드 폭(블록)입니다.
terrain_shaping.mountainRegionFullHeightSpanBlocks.range=160 .. 8192

terrain_shaping.riverMaximumDepthBlocks.en=Maximum mapped river depth in blocks; currently fixed at 6 (only 6 is accepted).
terrain_shaping.riverMaximumDepthBlocks.ko=지도 강의 최대 수심(블록)입니다. 현재 6으로 고정되어 있으며 6만 입력할 수 있습니다.
terrain_shaping.riverMaximumDepthBlocks.range=6 .. 6

river_widths.color_000064.en=Base width in blocks for river-map color #000064, before width scaling.
river_widths.color_000064.ko=강 지도 색상 #000064의 기본 강 너비(블록)입니다. 너비 배율 적용 전 값입니다.
river_widths.color_000064.range=1 .. 256

river_widths.color_000096.en=Base width in blocks for river-map color #000096, before width scaling.
river_widths.color_000096.ko=강 지도 색상 #000096의 기본 강 너비(블록)입니다. 너비 배율 적용 전 값입니다.
river_widths.color_000096.range=1 .. 256

river_widths.color_0000C8.en=Base width in blocks for river-map color #0000C8, before width scaling.
river_widths.color_0000C8.ko=강 지도 색상 #0000C8의 기본 강 너비(블록)입니다. 너비 배율 적용 전 값입니다.
river_widths.color_0000C8.range=1 .. 256

river_widths.color_0000FF.en=Base width in blocks for river-map color #0000FF, before width scaling.
river_widths.color_0000FF.ko=강 지도 색상 #0000FF의 기본 강 너비(블록)입니다. 너비 배율 적용 전 값입니다.
river_widths.color_0000FF.range=1 .. 256

river_widths.color_0064FF.en=Base width in blocks for river-map color #0064FF, before width scaling.
river_widths.color_0064FF.ko=강 지도 색상 #0064FF의 기본 강 너비(블록)입니다. 너비 배율 적용 전 값입니다.
river_widths.color_0064FF.range=1 .. 256

river_widths.color_00C8FF.en=Base width in blocks for river-map color #00C8FF, before width scaling.
river_widths.color_00C8FF.ko=강 지도 색상 #00C8FF의 기본 강 너비(블록)입니다. 너비 배율 적용 전 값입니다.
river_widths.color_00C8FF.range=1 .. 256

river_widths.color_00E1FF.en=Base width in blocks for river-map color #00E1FF, before width scaling.
river_widths.color_00E1FF.ko=강 지도 색상 #00E1FF의 기본 강 너비(블록)입니다. 너비 배율 적용 전 값입니다.
river_widths.color_00E1FF.range=1 .. 256

river_widths.widthScale.en=Global multiplier for source river widths; 0.5 halves them before minimum/maximum constraints.
river_widths.widthScale.ko=원본 강 너비의 전역 배율입니다. 0.5는 최소 및 최대 제한 적용 전에 너비를 절반으로 줄입니다.
river_widths.widthScale.range=0.05 .. 4.0

river_widths.minimumWidthBlocks.en=Minimum generated river width after scaling; 12 helps retain narrow rivers in quart-resolution biome sampling.
river_widths.minimumWidthBlocks.ko=배율 적용 후 생성할 강의 최소 너비(블록)입니다. 12는 4블록 단위 바이옴 샘플링에서도 좁은 강이 이어지도록 돕습니다.
river_widths.minimumWidthBlocks.range=1 .. 64

river_widths.gapBridgePixels.en=Maximum missing source pixels to bridge between aligned river endpoints; 0 disables bridging.
river_widths.gapBridgePixels.ko=방향이 이어지는 강 끝점 사이에서 복원할 누락 원본 픽셀 수의 최댓값입니다. 0이면 연결하지 않습니다.
river_widths.gapBridgePixels.range=0 .. 4

river_widths.channelContinentalness.en=Continentalness at the mapped river center; lower values guide a more water-like channel.
river_widths.channelContinentalness.ko=지도 강 중심의 대륙성 값입니다. 낮을수록 수로 지형으로 강하게 유도합니다.
river_widths.channelContinentalness.range=-0.8 .. -0.05

river_widths.bankFadeBlocks.en=Riverbank recovery distance in world blocks, independent of map pixel scale.
river_widths.bankFadeBlocks.ko=강둑이 주변 지형으로 돌아가는 월드 거리(블록)입니다. 지도 픽셀 축척과 독립적입니다.
river_widths.bankFadeBlocks.range=2 .. 128

river_widths.minimumInlandBlocks.en=Required surrounding land margin for mapped inland rivers; helps avoid treating small coastal islands as river biomes.
river_widths.minimumInlandBlocks.ko=내륙 강 주변에 필요한 육지 여백(블록)입니다. 작은 해안 섬이 강 바이옴으로 분류되는 것을 줄입니다.
river_widths.minimumInlandBlocks.range=4 .. 128

river_widths.channelEdgeFadeBlocks.en=Transition distance from riverbed to bank, in blocks; smoother transitions reduce abrupt water-edge cliffs.
river_widths.channelEdgeFadeBlocks.ko=강바닥에서 강둑으로 이어지는 전이 거리(블록)입니다. 완만한 전이는 물가의 급격한 절벽을 줄입니다.
river_widths.channelEdgeFadeBlocks.range=0 .. 128

surface_water.enabled.en=Suppress unmapped surface water on mapped land while retaining mapped oceans, rivers and allowed wetland water.
surface_water.enabled.ko=지도 육지의 비지정 지표수를 억제합니다. 지도상의 바다와 강, 허용된 습지 물은 유지합니다.
surface_water.enabled.range=true, false

surface_water.riverWidthScale.en=Desert river width multiplier; effective values above 0.30 are capped to prevent lake-like channels.
surface_water.riverWidthScale.ko=사막 강의 너비 배율입니다. 호수처럼 넓어지는 것을 막기 위해 실제 적용값은 최대 0.30으로 제한합니다.
surface_water.riverWidthScale.range=0.0 .. 1.0

surface_water.minimumRiverWidthBlocks.en=Minimum source river width eligible to survive in deserts before the desert width cap; thinner lines are suppressed.
surface_water.minimumRiverWidthBlocks.ko=사막에서 유지할 원본 강의 최소 너비입니다. 사막 너비 제한 전에 판단하며 더 좁은 선은 억제합니다.
surface_water.minimumRiverWidthBlocks.range=1 .. 128

surface_water.maximumRiverWidthBlocks.en=Maximum final water-channel width for surviving desert rivers, in blocks.
surface_water.maximumRiverWidthBlocks.ko=사막에 남는 강 수로의 최종 최대 수면 너비(블록)입니다.
surface_water.maximumRiverWidthBlocks.range=4 .. 64

structures.surfaceStructureRate.en=Fraction of eligible surface structure candidates retained; 1.0 is unchanged and 0.01 is 1 percent. Does not affect underground structures.
structures.surfaceStructureRate.ko=생성 후보로 선택된 지상 구조물을 유지할 비율입니다. 1.0은 그대로, 0.01은 1%입니다. 지하 구조물에는 적용하지 않습니다.
structures.surfaceStructureRate.range=0.01 .. 1.0
