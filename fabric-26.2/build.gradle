plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "earthshape" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java {
            setSrcDirs(['src/main/java'])
            exclude 'terrablender/**'
            // The Fabric entrypoint performs the equivalent direct codec registration.
            exclude 'io/github/earthshape/worldgen/EarthShapeDensityFunctions.java'
            // Fabric registers these codecs during mod initialization; the
            // common implementation is tied to NeoForge's DeferredRegister.
            exclude 'io/github/earthshape/worldgen/EarthShapeDensityFunctions.java'
        }
        resources.srcDir('../src/main/resources')
    }
}

processResources {
    exclude 'META-INF/**'
    exclude 'pack.mcmeta'
    exclude 'earthshape.mixins.json'
    // This is the NeoForge mixin descriptor inherited with common resources.
    exclude 'earthshape.mixins.json'
    from('../map') {
        include 'terrain.bmp', 'rivers.bmp', 'trees.bmp', 'world_normal.bmp', 'earth_temperature.png', 'worldmap_full.png', 'world_rivers_full.png', 'worldmap_river.png'
        into 'earthshape/hoi4'
    }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
