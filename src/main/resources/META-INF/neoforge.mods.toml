modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="EarthShape contributors"
description='''Earth-shaped continentalness controls for NeoForge 1.21.1 world generation.'''

[[mixins]]
config="earthshape.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# EarthShape's three climate-axis density functions must be decoded after
# Terralith's built-in datapack. Terralith's final density, surface rules,
# carvers, structures and biome JSON remain active around those axes.
[[dependencies.${mod_id}]]
modId="terralith"
type="optional"
versionRange="[2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lithostitched"
type="optional"
versionRange="[1,)"
ordering="AFTER"
side="BOTH"

# When TFC is installed, EarthShape supplies an experimental replacement for
# the tfc:overworld preset. Loading after TFC lets that resource override the
# preset's custom generator with Minecraft's noise generator, which is the
# generator EarthShape's density and biome layers target.
[[dependencies.${mod_id}]]
modId="tfc"
type="optional"
versionRange="[4.2.7,)"
ordering="AFTER"
side="BOTH"

